# ===========================================================================
# AuraFlow-AI — Docker Compose Configuration
# Multi-container deployment (FastAPI Backend + React Nginx Frontend)
# ===========================================================================

services:
  # ── AuraFlow Backend (FastAPI) ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: auraflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=*
      - AURA_DEVICE=auto
      - HF_HOME=/app/backend/models/hf_cache
    volumes:
      - auraflow-models:/app/backend/models
      - auraflow-outputs:/app/backend/outputs
      - auraflow-projects:/app/backend/projects
    shm_size: "8gb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── AuraFlow Frontend (React Nginx Server) ───────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: auraflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  auraflow-outputs:
  auraflow-projects:
  auraflow-models:
